services:
  evolution:
    image: atendai/evolution-api:v2.2.3
    container_name: thiago-veras-evolution
    restart: unless-stopped
    # Só localhost: o painel controla o WhatsApp e não pode ficar público.
    # Acesse de fora com túnel SSH: ssh -L 8080:localhost:8080 ubuntu@IP
    ports:
      - "127.0.0.1:8080:8080"
    env_file:
      - .env
    # Permite ao container chamar o backend que roda no host (webhook e mídias)
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - evolution_instances:/evolution/instances
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started

  postgres:
    image: postgres:16-alpine
    container_name: thiago-veras-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: evolution
      POSTGRES_PASSWORD: evolution_pass_change_me
      POSTGRES_DB: evolution
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U evolution -d evolution"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: thiago-veras-redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data

  # HTTPS pro painel /admin. Opcional: docker compose --profile https up -d
  caddy:
    image: caddy:2-alpine
    container_name: thiago-veras-caddy
    profiles: ["https"]
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN:-}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  evolution_instances:
  postgres_data:
  redis_data:
  caddy_data:
  caddy_config:

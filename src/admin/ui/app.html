<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="color-scheme" content="only light">
<meta name="theme-color" content="#2b2b2b">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Painel">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Painel de reservas — Thiago Veras</title>
<link rel="manifest" href="/admin/manifest.webmanifest">
<link rel="icon" type="image/png" href="/admin/ui/icon-192.png">
<link rel="apple-touch-icon" href="/admin/ui/icon-192.png">
<link rel="stylesheet" href="/admin/ui/app.css?v=__V__">
</head>
<body class="app">
<header class="barra">
  <div class="barra-in">
    <img src="/admin/ui/logo-icone.png" alt="" width="42" height="24">
    <div class="barra-t"><strong>Painel</strong><span id="status">Carregando…</span></div>
    <button class="icone" id="atualizar" type="button" aria-label="Atualizar"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 11a8 8 0 1 0-2.3 5.7"/><path d="M20 4v7h-7"/></svg></button>
    <button class="icone" id="menu" type="button" aria-label="Menu"><svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><circle cx="12" cy="5" r="1.8"/><circle cx="12" cy="12" r="1.8"/><circle cx="12" cy="19" r="1.8"/></svg></button>
  </div>
  <p class="offline" id="offline" hidden>Sem conexão. Tentando de novo…</p>
</header>

<main id="conteudo" class="conteudo" aria-live="polite">
  <div class="esqueleto"><i></i><i></i><i></i></div>
</main>

<nav class="abas" aria-label="Seções">
  <button type="button" data-aba="pedidos" class="ativa"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 5h16v14H4z"/><path d="M4 9h16M8 13h5"/></svg><span>Pedidos</span><b id="badge" hidden>0</b></button>
  <button type="button" data-aba="calendario"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg><span>Calendário</span></button>
  <button type="button" data-aba="bloquear"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg><span>Bloquear</span></button>
</nav>

<div class="toasts" id="toasts" aria-live="assertive"></div>
<div class="folha-fundo" id="fundo" hidden></div>
<section class="folha" id="folha" role="dialog" aria-modal="true" hidden></section>

<script src="/admin/ui/forca.js?v=__V__"></script>
<script src="/admin/ui/app.js?v=__V__"></script>
</body>
</html>
